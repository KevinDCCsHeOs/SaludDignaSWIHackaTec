name: Imágenes Docker

# Valida que el Dockerfile de producción y docker-compose.prod.yml construyen (#35).
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validar docker-compose.prod.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolver la configuración con variables de ejemplo
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod.example config --quiet

      - name: Validar Nginx (nginx -t) con un certificado de prueba
        run: |
          DOMINIO=ejemplo.com
          mkdir -p /tmp/nginx/conf.d "/tmp/le/live/app.$DOMINIO"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=app.$DOMINIO" \
            -keyout "/tmp/le/live/app.$DOMINIO/privkey.pem" \
            -out "/tmp/le/live/app.$DOMINIO/fullchain.pem"
          DOMINIO=$DOMINIO envsubst '${DOMINIO}' \
            < infra/nginx/templates/default.conf.template > /tmp/nginx/conf.d/default.conf
          # Sin los demás contenedores: Nginx debe arrancar aunque api, web o el bot no existan
          docker run --rm \
            -v /tmp/nginx/conf.d:/etc/nginx/conf.d:ro \
            -v /tmp/le:/etc/letsencrypt:ro \
            nginx:1.27-alpine nginx -t

  imagen:
    name: Construir imagen (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [api, whatsapp-bot, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build --target ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ejemplo.com
            NEXT_PUBLIC_WS_URL=https://api.ejemplo.com
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
