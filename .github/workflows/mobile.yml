name: App móvil

# Reproduce el paso "Bundle JavaScript" de EAS para detectar módulos faltantes antes de gastar un build.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle Android (Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar paquetes compartidos
        run: npm run prebuild:paquetes --workspace=@salud-digna/mobile
      - name: Versiones esperadas por Expo SDK
        working-directory: apps/mobile
        run: npx expo install --check || true
      - name: Empaquetar JavaScript para Android
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.saluddigna-omnicanal.tech
        run: npx expo export --platform android --output-dir dist-android
