# Producción en la VPS Hostinger KVM 2 (#35, ADR 0008).
# Uso (desde la raíz del repo):
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
# Solo Nginx publica puertos (80/443). MySQL y Redis viven en la red interna.
name: salud-digna

x-reinicio: &reinicio
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

x-build-api: &build-api
  context: ..
  dockerfile: infra/docker/Dockerfile
  target: api

x-entorno-api: &entorno-api
  NODE_ENV: production
  PORT: '3000'
  DATABASE_URL: mysql://salud_digna_app:${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}@mysql:3306/salud_digna?charset=utf8mb4
  REDIS_URL: redis://redis:6379
  WEB_BASE_URL: https://app.${DOMINIO:?Falta DOMINIO}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Falta JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET}
  API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?Falta API_SERVICE_TOKEN}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY}
  CURP_HASH_PEPPER: ${CURP_HASH_PEPPER:?Falta CURP_HASH_PEPPER}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_API_KEY: ${LLM_API_KEY:-}
  EXPO_PUSH_DESHABILITADO: ${EXPO_PUSH_DESHABILITADO:-0}
  # Temporizadores del traspaso v2: produccion (10/30 min) o exposicion (30/60 s) para el demo
  PLAZOS_PERFIL: ${PLAZOS_PERFIL:-produccion}
  # El API envía el OTP por WhatsApp (#8) y reconoce a Ana con el celular del demo
  WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
  WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
  DEMO_TELEFONO_PACIENTE: ${DEMO_TELEFONO_PACIENTE:-}

services:
  mysql:
    <<: *reinicio
    image: mysql:8.4
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    environment:
      MYSQL_DATABASE: salud_digna
      MYSQL_USER: salud_digna_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources: { limits: { memory: 1536m } }

  redis:
    <<: *reinicio
    image: redis:7-alpine
    # AOF: streams de eventos, OTP, sesiones y tokens push sobreviven reinicios
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # Aplica migraciones de Prisma una vez por despliegue y termina
  migraciones:
    image: salud-digna/api:latest
    build: *build-api
    command: ['npx', 'prisma', 'migrate', 'deploy', '--schema=prisma/schema.prisma']
    environment: *entorno-api
    depends_on:
      mysql: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *reinicio
    image: salud-digna/api:latest
    build: *build-api
    environment: *entorno-api
    depends_on:
      migraciones: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 768m } }

  whatsapp-bot:
    <<: *reinicio
    image: salud-digna/whatsapp-bot:latest
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: whatsapp-bot
    environment:
      NODE_ENV: production
      PORT: '3001'
      API_BASE_URL: http://api:3000
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?Falta API_SERVICE_TOKEN}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      PLAZOS_PERFIL: ${PLAZOS_PERFIL:-produccion}
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 384m } }

  web:
    <<: *reinicio
    image: salud-digna/web:latest
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMINIO:?Falta DOMINIO}
        NEXT_PUBLIC_WS_URL: https://api.${DOMINIO:?Falta DOMINIO}
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 512m } }

  nginx:
    <<: *reinicio
    image: nginx:1.27-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO}
    volumes:
      - ./nginx/templates:/etc/nginx/plantillas:ro
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot:ro
    # 1) Sustituye solo $${DOMINIO} en la plantilla (las variables propias de Nginx se respetan)
    # 2) Recarga Nginx cada 6 h para tomar certificados renovados por certbot
    command:
      - /bin/sh
      - -c
      - >-
        envsubst '$${DOMINIO}' < /etc/nginx/plantillas/default.conf.template > /etc/nginx/conf.d/default.conf
        && (while :; do sleep 6h; nginx -s reload; done &)
        && exec nginx -g 'daemon off;'
    depends_on:
      - web
      - api
      - whatsapp-bot
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 0']
      interval: 30s
      timeout: 5s
      retries: 3

  # Monitoreo de uptime con alertas a Discord/Telegram (#36).
  # Activar con: docker compose -f infra/docker-compose.prod.yml --profile monitoreo up -d
  uptime-kuma:
    <<: *reinicio
    image: louislam/uptime-kuma:1
    profiles: ['monitoreo']
    ports:
      - '127.0.0.1:3003:3001'
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources: { limits: { memory: 256m } }

  certbot:
    <<: *reinicio
    image: certbot/certbot:latest
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    # Intenta renovar cada 12 h (solo renueva si faltan < 30 días)
    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!}; done

volumes:
  mysql-data:
  redis-data:
  uptime-kuma-data:
